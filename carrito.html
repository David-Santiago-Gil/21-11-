<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Gaming Utopia</title>
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>
    <header>
        <div class="top-bar">
            <div class="logo">
                <a href="index.html"><img src="img/logo.png" alt="Gaming Utopia Logo"></a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="tienda.html">Tienda</a></li>
                    <li><a href="informacion.html">Informacion</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                </ul>
            </nav>
            <div class="auth-buttons">
                <div class="cart-icon" id="cartIcon">
                    <a href="carrito.html">
                        <span style="font-size: 30px; line-height: 1;">🛒</span>
                        <span id="cartCount" style="position: absolute; top: 10px; right: 80px; background-color: #8a2be2; color: white; border-radius: 50%; padding: 0 6px; font-size: 0.8em; display: none;">0</span>
                    </a>
                </div>
                <button id="loginBtn" class="login-button">LOGIN</button>
                <div class="profile-icon">
                    <img src="https://via.placeholder.com/30x30/8a2be2/ffffff?text=👤" alt="Profile Icon" id="profileIcon">
                </div>
            </div>
        </div>
        </header>

    <main class="container" style="padding-top: 50px;">
        <section class="cart-summary">
            <h1 style="color: #8a2be2;">🛒 Tu Carrito de Compras</h1>
            <p>Revisa tus artículos antes de proceder al pago.</p>
            
            <div id="cartItemsContainer" class="cart-list">
                </div>

            <div class="cart-total-box" style="margin-top: 30px; padding: 20px; border-top: 2px solid #333; display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin: 0;">Total:</h2>
                <span id="cartTotal" style="font-size: 1.8em; font-weight: bold; color: #4CAF50;">COP 0</span>
            </div>
            
            <div style="text-align: right; margin-top: 20px;">
                <a href="tienda.html" class="login-button" style="background-color: #333; margin-right: 10px;">Continuar Comprando</a>
                <button id="checkoutBtn" class="login-button" style="background-color: #8a2be2;">Finalizar Compra</button>
            </div>
        </section>
    </main>
    
    <footer>
        </footer>

    <div id="authModal" class="modal">...</div>
    <div id="profileModal" class="modal">...</div>
    
    <script src="js/script.js"></script>
</body>
</html>
