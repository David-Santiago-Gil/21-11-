<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Utopia - Carrito de Compras</title>
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <div class="logo">
                <a href="index.html"><img src="img/logo.png" alt="Gaming Utopia Logo"></a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="tienda.html">Tienda</a></li>
                    <li><a href="informacion.html">Informacion</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                </ul>
            </nav>
            <div class="auth-buttons">
                <div class="cart-icon" id="cartIcon">
                    <a href="carrito.html">
                        <span style="font-size: 30px; line-height: 1;">🛒</span>
                        <span id="cartCount" style="position: absolute; top: 10px; right: 80px; background-color: #8a2be2; color: yellow; border-radius: 50%; padding: 0 6px; font-size: 0.8em; display: none;">0</span>
                    </a>
                </div>
                <button id="loginBtn" class="login-button">LOGIN</button>
                <div class="profile-icon">
                    <img src="https://via.placeholder.com/30x30/8a2be2/ffffff?text=👤" alt="Profile Icon" id="profileIcon">
                </div>
            </div>
        </div>
        <div class="secondary-nav">
            <div class="dropdown">
                <a href="#" class="dropbtn">Categorías ▼</a>
                <div class="dropdown-content">
                    <a href="categorias.html#accion">Acción</a>
                    <a href="categorias.html#aventura">Aventura</a>
                    <a href="categorias.html#rpg">RPG</a>
                    <a href="categorias.html#deportes">Deportes</a>
                </div>
            </div>
            <div class="dropdown">
                <a href="#" class="dropbtn">Juegos ▼</a>
                <div class="dropdown-content">
                    <a href="juegos.html#populares">Populares</a>
                    <a href="juegos.html#nuevos">Nuevos Lanzamientos</a>
                    <a href="juegos.html#proximos">Próximos</a>
                </div>
            </div>
            <div class="dropdown">
                <a href="#" class="dropbtn">Colección ▼</a>
                <div class="dropdown-content">
                    <a href="catalogo.html#ofertas">Ofertas</a>
                    <a href="catalogo.html#free-to-play">Free to Play</a>
                    <a href="catalogo.html#exclusivos">Exclusivos</a>
                </div>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar">
                <button id="searchBtn">Buscar</button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <section id="cartSection" style="padding: 40px 0;">
                <h1 style="color: #8a2be2; border-bottom: 2px solid #333; padding-bottom: 10px;">Tu Carrito de Compras</h1>
                <div id="cartItemsContainer" style="margin-top: 30px;">
                    </div>

                <div id="cartSummary" style="margin-top: 40px; border-top: 2px solid #333; padding-top: 20px;">
                    <h3 style="color: white;">Total: <span id="cartTotal">COP 0</span></h3>
                    <button id="checkoutBtn" class="login-button" style="background-color: #8a2be2; padding: 10px 30px; margin-top: 15px;">Proceder al Pago</button>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="juegos.html">JUEGOS</a>
            <a href="soporte.html">SOPORTE</a>
            <a href="compañia.html">COMPAÑÍA</a>
        </div>
        <div class="social-media">
            <a href="https://www.facebook.com/profile.php?id=61583972560512" target="_blank"><img src="img/facebook.png" alt="Facebook"></a>
            <a href="https://x.com/Gamer_Nexus_inf" target="_blank"><img src="img/twitter.png" alt="Twitter"></a>
            <a href="https://www.instagram.com/gamernexus7/" target="_blank"><img src="img/instagram.png" alt="Instagram"></a>
            <a href="https://www.youtube.com/channel/UClqxaJ3XkmHXd8nk8LJYFag" target="_blank"><img src="img/youtube.png" alt="YouTube"></a>
        </div>
    </footer>

    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div class="auth-tabs">
                <button id="loginTab" class="auth-tab active">Iniciar Sesión</button>
                <button id="registerTab" class="auth-tab">Registrarse</button>
            </div>
            <div id="loginForm" class="auth-form active">
                <label for="loginUserEmail">Usuario o Correo</label>
                <input type="text" id="loginUserEmail" name="loginUserEmail">
                <label for="loginPassword">Contraseña</label>
                <input type="password" id="loginPassword" name="loginPassword">
                <button id="submitLogin">Iniciar Sesión</button>
            </div>
            <div id="registerForm" class="auth-form">
                <label for="registerUser">Usuario</label>
                <input type="text" id="registerUser" name="registerUser">
                <label for="registerEmail">Correo</label>
                <input type="email" id="registerEmail" name="registerEmail">
                <label for="registerPassword">Contraseña</label>
                <input type="password" id="registerPassword" name="registerPassword">
                <label for="registerPhone">Teléfono (Opcional)</label>
                <input type="tel" id="registerPhone" name="registerPhone">
                <button id="submitRegister">Registrarse</button>
            </div>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Perfil de Usuario</h2>
            <p>Bienvenido, <span id="profileUsername">Invitado</span>!</p>
            <button id="logoutBtn">Cerrar Sesión</button>
        </div>
    </div>
    
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        crossorigin="anonymous">
    </script>
    <script src="js/script.js"></script>
</body>
</html>
